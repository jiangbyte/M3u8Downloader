[package]
name = "m3u8-downloader"
version = "0.1.0"
description = "Cross-platform M3U8 multi-threaded downloader"
authors = ["charlie"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "process", "time", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks", "gzip", "brotli", "deflate", "stream"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
aes = "0.8"
cbc = "0.1"
hex = "0.4"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
futures = "0.3"
bytes = "1"
base64 = "0.22"
